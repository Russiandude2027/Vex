name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repo with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Build Scripts
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "❌ ERROR: Could not find Madeira.xcodeproj in the repository!"
            echo "Please check if Madeira.xcodeproj is committed to Git."
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$PROJ_FILE")
          PROJ_NAME=$(basename "$PROJ_FILE")
          
          echo "Found project at: $PROJ_FILE"
          cd "$PROJ_DIR"
          xcodebuild -project "$PROJ_NAME" -scheme Madeira -configuration Release -sdk iphoneos CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build"

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/ 2>/dev/null || true
          zip -r Russiandude2027.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Russiandude2027-IPA
          path: Russiandude2027.ipa
