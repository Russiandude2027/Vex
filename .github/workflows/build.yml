name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repo with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Build Scripts
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "❌ ERROR: Could not find Madeira.xcodeproj!"
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$PROJ_FILE")
          PROJ_NAME=$(basename "$PROJ_FILE")
          
          echo "Nuking the blocking dylib signing build phase script..."
          python3 -c "
          import re
          pbx_path = '$PROJ_FILE/project.pbxproj'
          with open(pbx_path, 'r') as f:
              content = f.read()
          pattern = r'(isa = PBXShellScriptBuildPhase.*?shellScript = \")(.*?)(\";)'
          def replacer(match):
              script_body = match.group(2)
              if 'codesign' in script_body or 'dylib' in script_body:
                  print('Neutralizing script phase containing signing logic.')
                  return match.group(1) + 'echo \"Skipping dylib signing script phase\"' + match.group(3)
              return match.group(0)
          new_content = re.sub(pattern, replacer, content, flags=re.DOTALL)
          with open(pbx_path, 'w') as f:
              f.write(new_content)
          "
          
          echo "Building project at: $PROJ_FILE"
          cd "$PROJ_DIR"
          xcodebuild -project "$PROJ_NAME" \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build"

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/ 2>/dev/null || true
          zip -r Russiandude2027.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Russiandude2027-IPA
          path: Russiandude2027.ipa
